services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carmaintenance}
      POSTGRES_USER: ${POSTGRES_USER:-carmaintenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carmaintenance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carmaintenance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      # The agentic layer lives at the repo root, outside the ./backend build
      # context, so it is mounted in rather than copied. Keeping it at the root
      # (instead of moving it under backend/) means feature/agentic-loop stays
      # mergeable and `python -m carmed.cli` still works from the repo root.
      - ./carmed:/app/carmed
      - ./adapters:/app/adapters
      # adapters/armenian.py imports this; without the mount the Django seam
      # silently falls back to NullResearchTool and every answer loses its
      # parts, shops and sources.
      - ./research:/app/research
      - ./data:/app/data
      - ./tests:/app/tests
      - media_data:/app/media
      # The sentence-transformers weights are ~500MB and are fetched at first
      # use, not at build time. Without this they are re-downloaded every time
      # the container is recreated.
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-carmaintenance}:${POSTGRES_PASSWORD:-carmaintenance}@db:5432/${POSTGRES_DB:-carmaintenance}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-${DEEP_SEEK_API_KEY:-}}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      # Parts and knowledge search. turn.am (workshops) needs no key.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  hf_cache:
